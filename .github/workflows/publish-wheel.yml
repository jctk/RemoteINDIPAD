name: Publish Release Wheel

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build packaging

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c "import os, tomllib; from packaging.version import Version; version = Version(tomllib.load(open('pyproject.toml', 'rb'))['project']['version']); tag = Version(os.environ['RELEASE_TAG'].removeprefix('v')); assert tag == version, f'Release tag {tag} does not match package version {version}'"

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheel to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber