name: Publish Release Wheel

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to upload the wheel to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build packaging

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          python -c "import os; from pathlib import Path; from packaging.version import Version; version = Version(Path('VERSION').read_text().strip()); tag = Version(os.environ['RELEASE_TAG'].removeprefix('v')); assert tag == version, f'Release tag {tag} does not match package version {version}'"

      - name: Build sender and receiver wheels
        run: python -m build --wheel

      - name: Upload wheel to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl --clobber